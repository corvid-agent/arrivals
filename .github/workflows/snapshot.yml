name: snapshot

on:
  schedule:
    - cron: "0 14,18,22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh docs/snapshot.json from TestNet
        run: python3 scripts/refresh_snapshot.py
      - name: Commit if the board moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snapshot.json
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "Refresh TestNet snapshot.json"
            git push
          fi
